name: release
# A version in package.json that npm does not have yet, once on main, is published: @atmin.ai/review
# to npm, the tag v<version> on that commit, and the atmin-review formula in atmin-inc/homebrew-tap,
# tested before it is pushed. Releasing is merging a version bump, the same as deploying.
# npm: trusted publishing from this workflow (no npm token is stored). Homebrew: TAP_TOKEN,
# a token that may push to atmin-inc/homebrew-tap. Both live in the `release` environment.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - id: version
        name: Is this version new to npm?
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # npm view prints nothing and fails for a version it does not have.
          if npm view "@atmin.ai/review@$version" version >/dev/null 2>&1; then
            echo "published=no" >> "$GITHUB_OUTPUT"; echo "$version is already on npm; nothing to release."
          else
            echo "published=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'yes'
        run: npm ci --ignore-scripts
      - if: steps.version.outputs.published == 'yes'
        run: npm test
      - if: steps.version.outputs.published == 'yes'
        run: node packaging/verify.mjs
      # Trusted publishing needs npm 11.5.1 or later; fail here rather than at publish.
      - if: steps.version.outputs.published == 'yes'
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      # Every release so far is an alpha and `latest` points at it, so publish there explicitly.
      - if: steps.version.outputs.published == 'yes'
        run: npm publish --provenance --access public --tag latest
      - if: steps.version.outputs.published == 'yes'
        name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v${{ steps.version.outputs.version }}" -f sha="$GITHUB_SHA"

  # Runs for every version, not only one published just now, so a tap update that failed is
  # retried by the next run; it does nothing once the tap already installs this version.
  homebrew:
    needs: npm
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    env:
      VERSION: ${{ needs.npm.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Current Homebrew refuses formulas from a third-party tap until it is trusted; the
      # atmin-review formula depends on this tap's atmin formula.
      - name: Is the tap already on this version?
        run: |
          brew tap atmin-inc/tap
          brew trust atmin-inc/tap
          tap="$(brew --repository atmin-inc/tap)"
          echo "TAP=$tap" >> "$GITHUB_ENV"
          if grep -q "review-$VERSION.tgz\"" "$tap/Formula/atmin-review.rb"; then
            echo "CURRENT=yes" >> "$GITHUB_ENV"; echo "The tap already installs $VERSION."
          fi
      # A new version can 404 for a few minutes after npm accepts it (seen 2026-10-02).
      - name: Download the published archive and check it against npm's integrity
        if: env.CURRENT != 'yes'
        run: |
          url="https://registry.npmjs.org/@atmin.ai/review/-/review-$VERSION.tgz"
          for i in $(seq 1 30); do curl -fsSL -o review.tgz "$url" && break; sleep 20; done
          [ -s review.tgz ] || { echo "$url did not download"; exit 1; }
          expected="$(npm view "@atmin.ai/review@$VERSION" dist.integrity)"
          actual="sha512-$(openssl dgst -sha512 -binary review.tgz | base64 | tr -d '\n')"
          [ "$expected" = "$actual" ] || { echo "Archive integrity $actual is not npm's $expected"; exit 1; }
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 review.tgz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Write the formula into the tap
        if: env.CURRENT != 'yes'
        run: |
          sed -e "s|^  url \".*\"|  url \"$URL\"|" -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            packaging/homebrew/atmin-review.rb > "$TAP/Formula/atmin-review.rb"
          grep -q "$SHA256" "$TAP/Formula/atmin-review.rb" || { echo "The formula did not take the checksum"; exit 1; }
      - name: Install, test and audit before pushing
        if: env.CURRENT != 'yes'
        env:
          HOMEBREW_NO_INSTALL_FROM_API: '1'
        run: |
          brew install --build-from-source atmin-inc/tap/atmin-review
          brew test atmin-inc/tap/atmin-review
          brew audit --strict atmin-inc/tap/atmin-review
      - name: Push the tap
        if: env.CURRENT != 'yes'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          cd "$TAP"
          git config user.name 'atmin release'
          git config user.email 'release@atmin.ai'
          git add Formula/atmin-review.rb
          git commit -m "atmin-review $VERSION"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/atmin-inc/homebrew-tap.git" HEAD:main
